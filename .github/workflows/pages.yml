# Builds and publishes Shefa to GitHub Pages.
# The on-device screenshot reader (Tesseract) is downloaded here at build time, pinned to exact versions,
# so the site itself never loads anything from another server.
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test the budget math, parsing and privacy cleaning
        run: node tests/calc.test.mjs

      - name: Fetch the on-device screenshot reader (pinned versions)
        run: |
          mkdir -p /tmp/ocr && cd /tmp/ocr
          npm init -y >/dev/null
          npm install --no-audit --no-fund --ignore-scripts \
            tesseract.js@5.1.1 tesseract.js-core@5.1.1 \
            @tesseract.js-data/heb@1.0.0 @tesseract.js-data/eng@1.0.0 \
            pdfjs-dist@6.2.108

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest sw.js css js assets icons _site/
          touch _site/.nojekyll
          # every publish gets a fresh offline-cache name, so phones always see the 'new version' prompt
          sed -i "s/const VERSION = 'shefa-[^']*'/const VERSION = 'shefa-${GITHUB_SHA::10}'/" _site/sw.js
          grep -q "shefa-${GITHUB_SHA::10}" _site/sw.js
          V=_site/vendor/tesseract
          mkdir -p $V/core $V/lang
          cp /tmp/ocr/node_modules/tesseract.js/dist/tesseract.min.js $V/
          cp /tmp/ocr/node_modules/tesseract.js/dist/worker.min.js $V/
          cp /tmp/ocr/node_modules/tesseract.js-core/tesseract-core*.js /tmp/ocr/node_modules/tesseract.js-core/tesseract-core*.wasm $V/core/
          cp /tmp/ocr/node_modules/@tesseract.js-data/heb/4.0.0_best_int/heb.traineddata.gz $V/lang/
          cp /tmp/ocr/node_modules/@tesseract.js-data/eng/4.0.0_best_int/eng.traineddata.gz $V/lang/
          cp /tmp/ocr/node_modules/tesseract.js/LICENSE.md $V/LICENSE-tesseract.js.md || true
          P=_site/vendor/pdfjs && mkdir -p $P
          cp /tmp/ocr/node_modules/pdfjs-dist/build/pdf.min.mjs /tmp/ocr/node_modules/pdfjs-dist/build/pdf.worker.min.mjs $P/
          cp -r /tmp/ocr/node_modules/pdfjs-dist/cmaps /tmp/ocr/node_modules/pdfjs-dist/standard_fonts $P/
          cp -r /tmp/ocr/node_modules/pdfjs-dist/wasm $P/ 2>/dev/null || true
          cp /tmp/ocr/node_modules/pdfjs-dist/LICENSE $P/LICENSE-pdfjs || true
          echo "Files:" && find _site -type f | sort && du -sh _site

      - name: Check the screenshot reader on sample screenshots (real browser)
        run: |
          rm -rf /tmp/t && cp -r _site /tmp/t
          cp -r tests/ocr-smoke.html tests/fixtures /tmp/t/
          cd /tmp/ocr && npm install --no-audit --no-fund --ignore-scripts puppeteer-core@23.11.1
          NODE_PATH=/tmp/ocr/node_modules node $GITHUB_WORKSPACE/tests/ocr-smoke.cjs /tmp/t

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
